plugins {
    id 'com.android.application'
}

android {
    namespace 'com.giaoimgiao.fanqieshow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.giaoimgiao.fanqieshow'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    compileOnly files('libs/XposedBridgeApi-82.jar')
}