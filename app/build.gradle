plugins {
    id 'com.android.application'
}

android {
    namespace 'com.giaoimgiao.fanqieshow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.giaoimgiao.fanqieshow'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    compileOnly files('libs/XposedBridgeApi-82.jar')
}